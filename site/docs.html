<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Gruvbox Clean docs</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{root}}docs/assets/docs.css">
</head>
<body data-root="{{root}}">
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <button class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="logo" href="{{root}}docs/"><span class="mark" aria-hidden="true"></span>Gruvbox Clean <span class="tag">docs</span></a>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="q" type="search" placeholder="Search docs" autocomplete="off" spellcheck="false" aria-label="Search the docs">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <nav class="top-links" aria-label="Site">
      <a href="{{root}}">Icon Studio</a>
      <a href="{{root}}docs/" class="on">Docs</a>
      <a href="{{releases}}">Download</a>
      <a href="{{github}}" class="gh" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 0 0-3 18.5c.5.1.7-.2.7-.5v-1.7c-2.6.6-3.2-1.2-3.2-1.2-.4-1.1-1-1.4-1-1.4-.9-.6 0-.6 0-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1 2.9.8.1-.6.3-1 .6-1.3-2.1-.2-4.3-1-4.3-4.6 0-1 .4-1.9 1-2.5-.1-.3-.4-1.2.1-2.5 0 0 .8-.3 2.6 1a9 9 0 0 1 4.8 0c1.8-1.3 2.6-1 2.6-1 .5 1.3.2 2.2.1 2.5.6.6 1 1.5 1 2.5 0 3.6-2.2 4.4-4.3 4.6.3.3.6.9.6 1.8v2.6c0 .3.2.6.7.5A9.5 9.5 0 0 0 12 2.5Z"/></svg>
      </a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav aria-label="Documentation">{{nav}}</nav>
    </aside>

    <main class="content" id="content">
      <article class="prose">{{content}}</article>
      <nav class="pager" aria-label="Previous and next page">{{pager}}</nav>
      <p class="edit"><a href="{{edit}}">Edit this page on GitHub</a></p>
    </main>

    <aside class="toc" aria-label="On this page">{{toc}}</aside>
  </div>

  <footer class="foot">
    <p>Gruvbox Clean · code under <a href="{{root}}docs/license/">Apache-2.0</a>, artwork under <a href="{{root}}docs/license/">CC BY-NC-SA 4.0</a> · palette by <a href="https://github.com/morhetz/gruvbox">Gruvbox</a></p>
  </footer>

  <script src="{{root}}docs/assets/search-index.js"></script>
  <script src="{{root}}docs/assets/docs.js"></script>
</body>
</html>
